name: Build HTML to Android APK
on: [push, workflow_dispatch]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets and Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "PromptHub AI" "com.kristalab.prompthub" --web-dir www
          npx cap add android
          if [ -f icon.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi*
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
            done
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptHub-AI-APK
          path: android/app/build/outputs/apk/debug/*.apk
