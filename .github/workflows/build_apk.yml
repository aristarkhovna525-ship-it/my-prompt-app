name: Build Release Android APK
on: [push, workflow_dispatch]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets and Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "PromptHub AI" "com.kristalab.prompthub" --web-dir www
          npx cap add android
          if [ -f icon.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi*
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
            done
          fi

      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias prompthub -storepass kristalab2026 -keypass kristalab2026 -dname "CN=Kristina Voitsekhovskaia, OU=Dev, O=Kristalab, L=Ulyanovsk, S=Ulyanovsk, C=RU"
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release-key.jks --ks-pass pass:kristalab2026 --key-pass pass:kristalab2026 --out app-release-signed.apk app-aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptHub-AI-Release-APK
          path: android/app-release-signed.apk
