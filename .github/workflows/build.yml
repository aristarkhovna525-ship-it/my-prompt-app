name: Build APK
on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install "cython<3.0.0" virtualenv buildozer

      - name: Config
        run: |
          /home/runner/.local/bin/buildozer init
          sed -i 's/requirements = python3/requirements = python3,kivy/g' buildozer.spec

      - name: Build
        run: |
          export BUILDOZER_ALLOW_KIVY_ROOT=1
          yes | /home/runner/.local/bin/buildozer android debug
          
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: compiled-apk
          path: bin/*.apk


