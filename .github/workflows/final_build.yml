name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build_apk:
    # Переключаемся на полностью совместимую среду окружения
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Compilers and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install --upgrade pip
          pip install "setuptools<60.0.0" wheel "cython<3.0.0" virtualenv python-for-android kivy

      - name: Packaging Application Directly
        run: |
          sudo chown -R runner:docker .
          
          # Явно прописываем системные пути к Android SDK и NDK
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle
          
          # Запуск прямой автоматической сборки приложения
          p4a apk --private . \
            --package=org.prompt.aiapp \
            --name="ИИ Промты" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy,cython \
            --arch=arm64-v8a \
            --android-api=34 \
            --accept-sdk-license

      - name: Save Finished Application
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: "*.apk"
