name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

      - name: Install Python Tools
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" virtualenv python-for-android kivy

      - name: Compile APK Directly
        run: |
          sudo chown -R runner:docker .
          
          # Прямая компиляция через python-for-android в обход Buildozer
          p4a apk --private . \
            --package=org.prompt.aiapp \
            --name="ИИ Промты" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=arm64-v8a \
            --accept-sdk-license

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: "*.apk"
