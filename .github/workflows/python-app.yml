name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install "cython<3.0.0" virtualenv buildozer

      - name: Initialize Buildozer
        run: |
          /home/runner/.local/bin/buildozer init
          sed -i 's/requirements = python3/requirements = python3,kivy/g' buildozer.spec

      - name: Compile APK
        env:
          KIVY_NO_CONSOLELOG: '1'
          KIVY_NO_ARGS: '1'
        run: |
          export BUILDOZER_ALLOW_KIVY_ROOT=1
          yes | /home/runner/.local/bin/buildozer android debug

      - name: Save Artifact
        uses: actions/upload-artifact@v3
        with:
          name: my-app-apk
          path: bin/*.apk

